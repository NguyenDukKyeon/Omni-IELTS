<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ff7657" />
  <title>Vocab Master — Ngoại tuyến</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8f2;color:#312e39;font:16px/1.55 system-ui,sans-serif;padding:24px}.card{max-width:520px;background:#fff;border:1px solid #ece4de;border-radius:28px;padding:34px;text-align:center;box-shadow:0 18px 50px rgba(78,57,43,.1)}.mark{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#ff7657;color:#fff;font-size:35px;font-weight:800}h1{margin:20px 0 8px}p{color:#7d7784}button{border:0;border-radius:15px;padding:13px 20px;background:#ff7657;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card"><div class="mark">V</div><h1>Bạn đang ngoại tuyến</h1><p>Nội dung đã mở trước đó vẫn có thể học. Kết nối mạng rồi thử lại để dùng AI, đồng bộ nhắc học hoặc tải nội dung mới.</p><button onclick="location.reload()">Thử kết nối lại</button></main>
</body>
</html>
