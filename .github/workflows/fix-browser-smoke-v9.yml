name: Fix Browser Smoke v9

on:
  push:
    branches: ['agent/roadmap-v9']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roadmap-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align browser smoke with empty-library contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/browser-smoke.mjs')
          source=path.read_text()
          marker="explicit sample deck load"
          if marker in source:
            raise SystemExit(0)
          old='''    await waitFor('window.VocabMasterApp','VocabMasterApp');
    await waitFor("document.querySelector('[data-view=\\"today\\"]')?.classList.contains('active')",'today route');

    await evaluate(`new Promise(resolve=>{'''
          new='''    await waitFor('window.VocabMasterApp','VocabMasterApp');
    await waitFor("document.querySelector('[data-view=\\"today\\"]')?.classList.contains('active')",'today route');
    assert.equal(await evaluate("window.VocabMasterApp.getState().cards.length"),0,'Fresh browser profile must preserve an intentionally empty library.');
    await evaluate("window.VocabMasterApp.loadSampleDeck()");
    await waitFor("window.VocabMasterApp.getState().cards.length>0",'explicit sample deck load');
    await waitFor("!document.getElementById('startToday').disabled",'enabled Today session after explicit sample load');

    await evaluate(`new Promise(resolve=>{'''
          if old not in source:
            raise SystemExit('Browser-smoke insertion point not found')
          path.write_text(source.replace(old,new,1))
          PY
          node --check scripts/browser-smoke.mjs
      - name: Commit correction when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/browser-smoke.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-smoke.mjs
          git commit -m 'test: align browser smoke with explicit sample loading'
          git push origin HEAD:agent/roadmap-v9
