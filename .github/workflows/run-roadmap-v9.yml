name: Run Roadmap v9 Patch

on:
  pull_request:
    branches: ['main']
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/roadmap-v9'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect completed patch
        id: state
        shell: bash
        run: |
          if [ ! -f .roadmap/gz/part00 ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.state.outputs.needed == 'true'
        with:
          node-version: 22

      - name: Reassemble implementation script
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          cat .roadmap/gz/part* | base64 --decode | gzip -dc > /tmp/apply-roadmap-v9.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('/tmp/apply-roadmap-v9.mjs')
          source=path.read_text()
          source=source.replace("  c=replaceOnce(c,'      - run: npm run check\\n      - run: npm run build','      - run: npm run check\\n      - run: npm run audit:roadmap\\n      - run: npm run build','CI roadmap audit');", "  c=replaceOnce(c,'      - run: npm run build','      - run: npm run audit:roadmap\\n      - run: npm run build','CI roadmap audit');")
          source=source.replace("const workflow=file('.github/workflows/implement-roadmap-v9.yml');if(fs.existsSync(workflow))fs.rmSync(workflow);const parts=file('.roadmap');if(fs.existsSync(parts))fs.rmSync(parts,{recursive:true,force:true});", "const workflow=file('.github/workflows/implement-roadmap-v9.yml');if(fs.existsSync(workflow))fs.rmSync(workflow);const parts=file('.roadmap');if(fs.existsSync(parts))fs.rmSync(parts,{recursive:true,force:true});const failure=file('ROADMAP_WORKFLOW_FAILURE.md');if(fs.existsSync(failure))fs.rmSync(failure);")
          source=re.sub(r'(?<!\\)\$\{card\.id\}', r'\\${card.id}', source)
          source=re.sub(r'(?<!\\)\$\{seed\}', r'\\${seed}', source)
          source=re.sub(r'(?<!\\)\$\{value\}', r'\\${value}', source)
          source=re.sub(r'(?<!\\)\$\{drafts\.length\}', r'\\${drafts.length}', source)
          path.write_text(source)
          PY
          node --check /tmp/apply-roadmap-v9.mjs

      - name: Apply roadmap
        id: apply
        if: steps.state.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node /tmp/apply-roadmap-v9.mjs 2>&1 | tee /tmp/roadmap-apply.log

      - name: Record apply failure on branch
        if: steps.state.outputs.needed == 'true' && steps.apply.outcome == 'failure'
        shell: bash
        run: |
          git reset --hard HEAD
          {
            echo '# Roadmap v9 apply failure'
            echo
            echo '```text'
            tail -n 300 /tmp/roadmap-apply.log
            echo '```'
          } > ROADMAP_WORKFLOW_FAILURE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP_WORKFLOW_FAILURE.md
          git commit -m 'Record roadmap apply failure [roadmap-failed]' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Stop after apply failure
        if: steps.state.outputs.needed == 'true' && steps.apply.outcome == 'failure'
        run: exit 1

      - name: Syntax check
        id: syntax
        if: steps.state.outputs.needed == 'true' && steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          find src server public scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check 2>&1 | tee /tmp/roadmap-syntax.log

      - name: Record syntax failure on branch
        if: steps.state.outputs.needed == 'true' && steps.apply.outcome == 'success' && steps.syntax.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '# Roadmap v9 syntax failure'
            echo
            echo '```text'
            tail -n 300 /tmp/roadmap-syntax.log
            echo '```'
          } > ROADMAP_WORKFLOW_FAILURE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement roadmap with syntax report [roadmap-validation-failed]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Stop after syntax failure
        if: steps.state.outputs.needed == 'true' && steps.apply.outcome == 'success' && steps.syntax.outcome == 'failure'
        run: exit 1

      - name: Commit patch to implementation branch
        if: steps.state.outputs.needed == 'true' && steps.apply.outcome == 'success' && steps.syntax.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement roadmap v9 [roadmap-patched]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
