name: Apply Roadmap Audit Fixes

on:
  pull_request:
    branches: ['main']
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/roadmap-v9'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited corrections
        shell: bash
        run: node scripts/apply-audit-fixes.mjs
      - name: Syntax check
        shell: bash
        run: find src server public scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Commit audited corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix roadmap v9 audit findings [audit-fixed]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
