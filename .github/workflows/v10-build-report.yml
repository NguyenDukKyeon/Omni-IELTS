name: V10 Build Report
on:
  pull_request:
    branches: ['main']
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('build-output.txt','utf8').slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- v10-build-diagnostic -->\n### Temporary v10 build diagnostic\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
