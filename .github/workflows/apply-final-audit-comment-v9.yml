name: Apply Final Audit Comment v9

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  fix:
    if: github.event.issue.pull_request && github.event.issue.number == 1 && github.event.comment.body == '/apply-final-audit-v9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roadmap-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final audited fixes
        run: node scripts/final-audit-fix.mjs
      - name: Verify syntax
        run: |
          node --check src/persistence.js
          node --check src/app.js
          node --check scripts/browser-smoke.mjs
          node --check tests/persistence.test.mjs
          node --check src/progress.js
          node --check tests/roadmap-v9.test.mjs
      - name: Commit final fixes and remove temporary files
        shell: bash
        run: |
          rm -f scripts/final-audit-fix.mjs .final-audit-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close final roadmap audit findings [final-audit-fixed]'
          git push origin HEAD:agent/roadmap-v9
