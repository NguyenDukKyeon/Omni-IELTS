name: CI
on:
  push:
    branches: ['main', 'agent/roadmap-v9']
  pull_request:
    branches: ['main']
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  apply_scheduler_audit_fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/roadmap-v9' && !contains(github.event.head_commit.message, '[scheduler-audit-fixed]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roadmap-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct unlocked scheduling aggregation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/fsrs-scheduler.js')
          source=path.read_text()
          old='''export function unlockedSkillsForCard(card = {}) {
  const planned = plannedSkillsForCard(card);
  const map = existingSkillMap(card);
  const reviewed = skill => Number(map[skill]?.reps || 0) > 0;
  const unlocked = planned.filter(skill => skill === 'recognition' || skill === 'recall');
  const foundationReady = reviewed('recognition') && reviewed('recall');

  if (card.type === 'collocation' && planned.includes('collocation') && foundationReady) unlocked.push('collocation');
  const collocationReady = card.type !== 'collocation' || !planned.includes('collocation') || reviewed('collocation');
  if (planned.includes('listening') && foundationReady && collocationReady) unlocked.push('listening');
  if (planned.includes('production') && foundationReady && collocationReady && reviewed('listening')) unlocked.push('production');
  return [...new Set(unlocked)];
}'''
          new='''function unlockedSkillsFromMap(card = {}, map = {}) {
  const planned = plannedSkillsForCard(card);
  const reviewed = skill => Number(map[skill]?.reps || 0) > 0;
  const unlocked = planned.filter(skill => skill === 'recognition' || skill === 'recall');
  const foundationReady = (!planned.includes('recognition') || reviewed('recognition')) && (!planned.includes('recall') || reviewed('recall'));

  if (planned.includes('collocation') && foundationReady) unlocked.push('collocation');
  const collocationReady = !planned.includes('collocation') || reviewed('collocation');
  if (planned.includes('listening') && foundationReady && collocationReady) unlocked.push('listening');
  const listeningReady = !planned.includes('listening') || reviewed('listening');
  if (planned.includes('production') && foundationReady && collocationReady && listeningReady) unlocked.push('production');
  return [...new Set(unlocked)];
}

export function unlockedSkillsForCard(card = {}) {
  return unlockedSkillsFromMap(card, existingSkillMap(card));
}'''
          if old not in source:
            raise SystemExit('unlocked skill block not found')
          source=source.replace(old,new,1)
          old='''function aggregateSkillMap(card, fsrsBySkill, now, scheduler) {
  const required = requiredSkillsForCard(card);
  const entries = required.map(skill => [skill, deserializeValue(fsrsBySkill[skill], now)]);
  entries.sort((a, b) => a[1].due.getTime() - b[1].due.getTime());
  const [nextSkill, nextCard] = entries[0] || ['recognition', createEmptyCard(new Date(now))];
  const reviewed = entries.filter(([, value]) => value.reps > 0);
  const stabilityValues = reviewed.map(([, value]) => value.stability);
  const difficultyValues = reviewed.map(([, value]) => value.difficulty);
  const retrievability = nextCard.reps > 0 && nextCard.state !== State.New
    ? scheduler.get_retrievability(nextCard, new Date(now), false)
    : 0;
  return {
    nextSkill,
    dueAt: nextCard.due.getTime(),
    intervalDays: nextCard.scheduled_days,
    stability: stabilityValues.length ? Math.min(...stabilityValues) : 0,
    difficulty: difficultyValues.length ? difficultyValues.reduce((sum, value) => sum + value, 0) / difficultyValues.length : 0,
    retrievability,
    status: statusFromSkillMap(card, fsrsBySkill),
    skillCoverage: required.length ? reviewed.length / required.length : 0
  };
}'''
          new='''function aggregateSkillMap(card, fsrsBySkill, now, scheduler) {
  const planned = plannedSkillsForCard(card);
  const unlocked = unlockedSkillsFromMap(card, fsrsBySkill);
  const entries = unlocked.map(skill => [skill, deserializeValue(fsrsBySkill[skill], now)]);
  entries.sort((a, b) => a[1].due.getTime() - b[1].due.getTime());
  const [nextSkill, nextCard] = entries[0] || ['recognition', createEmptyCard(new Date(now))];
  const plannedEntries = planned.map(skill => [skill, deserializeValue(fsrsBySkill[skill], now)]);
  const reviewed = plannedEntries.filter(([, value]) => value.reps > 0);
  const stabilityValues = reviewed.map(([, value]) => value.stability);
  const difficultyValues = reviewed.map(([, value]) => value.difficulty);
  const retrievability = nextCard.reps > 0 && nextCard.state !== State.New
    ? scheduler.get_retrievability(nextCard, new Date(now), false)
    : 0;
  return {
    nextSkill,
    dueAt: nextCard.due.getTime(),
    intervalDays: nextCard.scheduled_days,
    stability: stabilityValues.length ? Math.min(...stabilityValues) : 0,
    difficulty: difficultyValues.length ? difficultyValues.reduce((sum, value) => sum + value, 0) / difficultyValues.length : 0,
    retrievability,
    status: statusFromSkillMap(card, fsrsBySkill),
    skillCoverage: planned.length ? reviewed.length / planned.length : 0
  };
}'''
          if old not in source:
            raise SystemExit('aggregate skill block not found')
          path.write_text(source.replace(old,new,1))

          test_path=Path('tests/roadmap-v9.test.mjs')
          tests=test_path.read_text()
          tests=tests.replace("import { plannedSkillsForCard, requiredSkillsForCard, unlockedSkillsForCard, getDueSkillItems } from '../src/fsrs-scheduler.js';","import { applyFsrsRating, plannedSkillsForCard, requiredSkillsForCard, unlockedSkillsForCard, getDueSkillItems } from '../src/fsrs-scheduler.js';")
          marker="test('collocation production waits for foundation, collocation and listening'"
          addition="""test('aggregate scheduling never selects a locked skill',()=>{const now=1_700_000_000_000;const base=sanitizeCardInput({front:'retain',back:'ghi nhớ',learningGoal:'active',status:'learning',createdAt:now});const recognition=applyFsrsRating(base,'good',now,undefined,'recognition').card;assert.equal(recognition.nextSkill,'recall');const recall=applyFsrsRating(recognition,'good',now+1_000,undefined,'recall').card;assert.equal(recall.nextSkill,'listening');assert.equal(recall.skillCoverage,.5);const custom=sanitizeCardInput({front:'deploy',back:'triển khai',targetSkills:['production'],status:'learning'});assert.deepEqual(unlockedSkillsForCard(custom),['production']);});
"""
          index=tests.find(marker)
          if index<0:
            raise SystemExit('roadmap test insertion point not found')
          tests=tests[:index]+addition+tests[index:]
          test_path.write_text(tests)
          PY
          node --check src/fsrs-scheduler.js
          node --check tests/roadmap-v9.test.mjs
      - name: Commit audited scheduler correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fsrs-scheduler.js tests/roadmap-v9.test.mjs
          git commit -m 'fix: keep aggregate scheduling on unlocked skills [scheduler-audit-fixed]'
          git push origin HEAD:agent/roadmap-v9
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test > test-output.txt 2>&1
      - name: Run cross-check
        id: crosscheck
        continue-on-error: true
        if: steps.tests.outcome == 'success'
        run: npm run check > check-output.txt 2>&1
      - name: Audit roadmap contracts
        id: roadmap
        continue-on-error: true
        if: steps.tests.outcome == 'success' && steps.crosscheck.outcome == 'success'
        run: npm run audit:roadmap > roadmap-output.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-output
          path: |
            test-output.txt
            check-output.txt
            roadmap-output.txt
          if-no-files-found: ignore
      - name: Report verification failure
        if: (steps.tests.outcome == 'failure' || steps.crosscheck.outcome == 'failure' || steps.roadmap.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.existsSync('test-output.txt') ? fs.readFileSync('test-output.txt', 'utf8') : '';
            const checkOutput = fs.existsSync('check-output.txt') ? fs.readFileSync('check-output.txt', 'utf8') : '';
            const roadmapOutput = fs.existsSync('roadmap-output.txt') ? fs.readFileSync('roadmap-output.txt', 'utf8') : '';
            const output = `${testOutput}\n${checkOutput}\n${roadmapOutput}`.slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- roadmap-v9-ci-report -->\n### CI verification failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on verification errors
        if: steps.tests.outcome == 'failure' || steps.crosscheck.outcome == 'failure' || steps.roadmap.outcome == 'failure'
        run: cat test-output.txt check-output.txt roadmap-output.txt 2>/dev/null || true; exit 1
      - run: npm run build
      - run: npm run test:serve
      - run: npm run test:preview
      - name: Run browser interaction smoke
        id: browser
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 100s npm run test:browser 2>&1 | tee browser-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-output
          path: browser-output.txt
          if-no-files-found: ignore
      - name: Report browser smoke failure
        if: steps.browser.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('browser-output.txt') ? fs.readFileSync('browser-output.txt', 'utf8').slice(-12000) : 'No browser output was produced.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- browser-smoke-report -->\n### Browser interaction smoke failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on browser interaction errors
        if: steps.browser.outcome == 'failure'
        run: cat browser-output.txt; exit 1
      - name: Run hardening browser smoke
        id: hardening
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 100s npm run test:hardening 2>&1 | tee hardening-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardening-browser-output
          path: hardening-output.txt
          if-no-files-found: ignore
      - name: Report hardening failure
        if: steps.hardening.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('hardening-output.txt') ? fs.readFileSync('hardening-output.txt', 'utf8').slice(-12000) : 'No hardening output was produced.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- hardening-smoke-report -->\n### Hardening browser smoke failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on hardening browser errors
        if: steps.hardening.outcome == 'failure'
        run: cat hardening-output.txt; exit 1
