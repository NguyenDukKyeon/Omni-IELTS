name: CI
on:
  push:
    branches: ['main', 'agent/roadmap-v9', 'agent/ielts-phases-0-5', 'agent/v10-unified-learning-platform']
  pull_request:
    branches: ['main']
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Install subtitle resolver dependency
        run: |
          python -m pip install --disable-pip-version-check yt-dlp
          yt-dlp --version > yt-dlp-version.txt
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test > test-output.txt 2>&1
      - name: Run cross-check
        id: crosscheck
        continue-on-error: true
        if: steps.tests.outcome == 'success'
        run: npm run check > check-output.txt 2>&1
      - name: Audit roadmap contracts
        id: roadmap
        continue-on-error: true
        if: steps.tests.outcome == 'success' && steps.crosscheck.outcome == 'success'
        run: npm run audit:roadmap > roadmap-output.txt 2>&1
      - name: Audit IELTS phases
        id: ieltsaudit
        continue-on-error: true
        if: steps.tests.outcome == 'success' && steps.crosscheck.outcome == 'success' && steps.roadmap.outcome == 'success'
        run: npm run audit:ielts > ielts-audit-output.txt 2>&1
      - name: Run v10 focused tests
        id: v10tests
        continue-on-error: true
        if: steps.tests.outcome == 'success' && steps.crosscheck.outcome == 'success' && steps.roadmap.outcome == 'success' && steps.ieltsaudit.outcome == 'success'
        run: npm run test:v10 > v10-test-output.txt 2>&1
      - name: Audit v10 phases 0-10
        id: v10audit
        continue-on-error: true
        if: steps.v10tests.outcome == 'success'
        run: npm run audit:v10 > v10-audit-output.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-output
          path: |
            test-output.txt
            check-output.txt
            roadmap-output.txt
            ielts-audit-output.txt
            v10-test-output.txt
            v10-audit-output.txt
            yt-dlp-version.txt
          if-no-files-found: ignore
      - name: Report verification failure
        if: (steps.tests.outcome == 'failure' || steps.crosscheck.outcome == 'failure' || steps.roadmap.outcome == 'failure' || steps.ieltsaudit.outcome == 'failure' || steps.v10tests.outcome == 'failure' || steps.v10audit.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = ['test-output.txt','check-output.txt','roadmap-output.txt','ielts-audit-output.txt','v10-test-output.txt','v10-audit-output.txt'];
            const output = files.map(file => fs.existsSync(file) ? `\n## ${file}\n${fs.readFileSync(file, 'utf8')}` : '').join('\n').slice(-18000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- v10-ci-report -->\n### Verification failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on verification errors
        if: steps.tests.outcome == 'failure' || steps.crosscheck.outcome == 'failure' || steps.roadmap.outcome == 'failure' || steps.ieltsaudit.outcome == 'failure' || steps.v10tests.outcome == 'failure' || steps.v10audit.outcome == 'failure'
        run: cat test-output.txt check-output.txt roadmap-output.txt ielts-audit-output.txt v10-test-output.txt v10-audit-output.txt 2>/dev/null || true; exit 1
      - run: npm run build
      - name: Run Phase 4 exact-head verification
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/phase-4-remote-content-platform'
        timeout-minutes: 8
        run: npm run phase4:verify
      - run: npm run test:serve
      - run: npm run test:preview
      - name: Run browser interaction smoke
        id: browser
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 100s npm run test:browser 2>&1 | tee browser-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-output
          path: browser-output.txt
          if-no-files-found: ignore
      - name: Report browser smoke failure
        if: steps.browser.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('browser-output.txt') ? fs.readFileSync('browser-output.txt', 'utf8').slice(-12000) : 'No browser output was produced.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- browser-smoke-report -->\n### Browser interaction smoke failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on browser interaction errors
        if: steps.browser.outcome == 'failure'
        run: cat browser-output.txt; exit 1
      - name: Run IELTS browser interaction smoke
        id: ieltsbrowser
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 150s npm run test:ielts-browser 2>&1 | tee ielts-browser-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ielts-browser-output
          path: ielts-browser-output.txt
          if-no-files-found: ignore
      - name: Report IELTS browser smoke failure
        if: steps.ieltsbrowser.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('ielts-browser-output.txt') ? fs.readFileSync('ielts-browser-output.txt', 'utf8').slice(-14000) : 'No IELTS browser output was produced.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- ielts-browser-smoke-report -->\n### IELTS browser smoke failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on IELTS browser interaction errors
        if: steps.ieltsbrowser.outcome == 'failure'
        run: cat ielts-browser-output.txt; exit 1
      - name: Run v10 browser interaction smoke
        id: v10browser
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 150s npm run test:v10-browser 2>&1 | tee v10-browser-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-browser-output
          path: v10-browser-output.txt
          if-no-files-found: ignore
      - name: Report v10 browser smoke failure
        if: steps.v10browser.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('v10-browser-output.txt') ? fs.readFileSync('v10-browser-output.txt', 'utf8').slice(-16000) : 'No v10 browser output was produced.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- v10-browser-smoke-report -->\n### V10 browser smoke failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on v10 browser interaction errors
        if: steps.v10browser.outcome == 'failure'
        run: cat v10-browser-output.txt; exit 1
      - name: Run hardening browser smoke
        id: hardening
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 100s npm run test:hardening 2>&1 | tee hardening-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardening-browser-output
          path: hardening-output.txt
          if-no-files-found: ignore
      - name: Report hardening failure
        if: steps.hardening.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('hardening-output.txt') ? fs.readFileSync('hardening-output.txt', 'utf8').slice(-12000) : 'No hardening output was produced.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- hardening-smoke-report -->\n### Hardening browser smoke failure\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Fail on hardening browser errors
        if: steps.hardening.outcome == 'failure'
        run: cat hardening-output.txt; exit 1
