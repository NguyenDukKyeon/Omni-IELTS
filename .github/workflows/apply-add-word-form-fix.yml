name: Apply Add Word Form Fix

on:
  pull_request:
    branches: ['main']
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/roadmap-v9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roadmap-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-add-word-form.mjs
      - run: |
          node --check src/app.js
          node --check scripts/check.mjs
      - name: Commit fix and remove patcher
        run: |
          rm -f scripts/fix-add-word-form.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve async add-word form reference [add-word-form-fixed]'
          git push origin HEAD:agent/roadmap-v9
